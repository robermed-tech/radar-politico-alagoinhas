name: Deploy Dashboard — Surge.sh

on:
  push:
    branches: [main]
    paths:
      - "radar-app/**"
  workflow_dispatch:

concurrency:
  group: surge-deploy
  # false: cancelar um run em andamento pode matar o "npx surge" no meio do
  # upload e deixar o domínio em "project not found" até o próximo deploy
  # terminar. Com false, pushes próximos apenas enfileiram.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: radar-app/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: radar-app

      - name: Build
        run: npm run build
        working-directory: radar-app
        env:
          VITE_SUPABASE_URL: https://wtlhqyqxhuchzloodoyx.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_80AckjG9pwL3DB0_uTPCjg_IS2VxOAo
          VITE_TENANT: alagoinhas

      - name: Copiar index.html → 200.html (SPA routing no Surge)
        run: cp radar-app/dist/index.html radar-app/dist/200.html

      - name: Deploy para Surge.sh (radar-politico-alg.surge.sh)
        run: npx surge --project radar-app/dist --domain radar-politico-alg.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      # radar-comando.surge.sh é o domínio documentado no CLAUDE.md como
      # "Frontend admin" oficial, mas até aqui só era atualizado manualmente
      # via deploy.bat na máquina do Robério — o que deixava esse domínio
      # desatualizado sempre que alguém esquecia de rodar o script depois de
      # um merge. Publicando os dois a partir do MESMO build garante que
      # qualquer usuário, em qualquer um dos dois domínios, sempre veja a
      # versão mais recente do main. deploy.bat continua funcionando como
      # fallback manual, mas deixa de ser necessário no fluxo normal.
      - name: Deploy para Surge.sh (radar-comando.surge.sh)
        run: npx surge --project radar-app/dist --domain radar-comando.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
