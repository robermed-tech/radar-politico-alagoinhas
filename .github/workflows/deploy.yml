name: Deploy Dashboard — Surge.sh

on:
  push:
    branches: [main]
    paths:
      - "radar-app/**"
  workflow_dispatch:

concurrency:
  group: surge-deploy
  # false: cancelar um run em andamento pode matar o "npx surge" no meio do
  # upload e deixar o domínio em "project not found" até o próximo deploy
  # terminar. Com false, pushes próximos apenas enfileiram.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: radar-app/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: radar-app

      - name: Build
        run: npm run build
        working-directory: radar-app
        env:
          VITE_SUPABASE_URL: https://wtlhqyqxhuchzloodoyx.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_80AckjG9pwL3DB0_uTPCjg_IS2VxOAo
          VITE_TENANT: alagoinhas

      - name: Copiar index.html → 200.html (SPA routing no Surge)
        run: cp radar-app/dist/index.html radar-app/dist/200.html

      # Endereço ÚNICO: o painel vive só em avaz.surge.sh. "Avaz" é o nome
      # DEFINITIVO do SaaS (decisão do Robério em 10/08/26; substitui o
      # provisório "radar-politico", que virou redirecionador abaixo). A
      # allowlist do Supabase Auth usa https://*.surge.sh, então a troca de
      # subdomínio não exigiu mexer no Auth.
      - name: Deploy para Surge.sh (avaz.surge.sh)
        run: npx surge --project radar-app/dist --domain avaz.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      # Transição: os endereços antigos (radar-politico, radar-comando e
      # radar-politico-alg) recebem uma página de REDIRECIONAMENTO que preserva
      # rota e parâmetros — quem tem favorito antigo cai no endereço novo em
      # vez de num "project not found". Estes steps podem ser removidos
      # quando ninguém mais chegar pelos endereços antigos.
      - name: Preparar página de redirecionamento (SPA fallback)
        run: cp radar-app/redirect-legado/index.html radar-app/redirect-legado/200.html

      - name: Redirecionador em radar-politico.surge.sh
        run: npx surge --project radar-app/redirect-legado --domain radar-politico.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Redirecionador em radar-politico-alg.surge.sh
        run: npx surge --project radar-app/redirect-legado --domain radar-politico-alg.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Redirecionador em radar-comando.surge.sh
        run: npx surge --project radar-app/redirect-legado --domain radar-comando.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
