name: Radar Politico — Pipeline Diario

on:
  schedule:
   # Roda 4x ao dia: 6h, 12h, 18h e 23h BRT
      - cron: '0 0  * * *'
      - cron: '0 8 * * *'
      - cron: '0 14 * * *'
      - cron: '0 19 * * *'
  # Permite rodar manualmente pelo GitHub (botão "Run workflow")
  workflow_dispatch:

jobs:
  pipeline:
    name: Coletar → Analisar → Atualizar Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 90        # limite de segurança: 1h30

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Criar service_account.json a partir do Secret
        # O conteudo completo do service_account.json fica no Secret GOOGLE_SA_JSON
        run: echo '${{ secrets.GOOGLE_SA_JSON }}' > service_account.json

      - name: Criar arquivo .env
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"            > .env
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}"               >> .env
          echo "APIFY_POST_ACTOR_ID=apify/instagram-post-scraper"             >> .env
          echo "APIFY_COMMENT_ACTOR_ID=apify/instagram-comment-scraper"       >> .env
          echo "GOOGLE_SERVICE_ACCOUNT_FILE=service_account.json"             >> .env
          echo "GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}"               >> .env
          echo "GOOGLE_SHEET_NAME=Radar"                                      >> .env
          echo "CLIENT_CONFIG=clientes/alagoinhas.json"                        >> .env
          echo "EVOLUTION_API_URL=${{ secrets.EVOLUTION_API_URL }}"   >> .env
          echo "EVOLUTION_API_KEY=${{ secrets.EVOLUTION_API_KEY }}"   >> .env
          echo "EVOLUTION_INSTANCE=${{ secrets.EVOLUTION_INSTANCE }}" >> .env
          echo "EVOLUTION_GROUP_ID=${{ secrets.EVOLUTION_GROUP_ID }}" >> .env

      - name: Executar pipeline completo (Apify + Claude + Sheets)
        run: python radar_agente.py

      - name: Resumo de sucesso
        if: success()
        run: |
          echo "## Pipeline concluido com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Acesse o Google Sheets para ver os novos dados." >> $GITHUB_STEP_SUMMARY

      - name: Alertar falha no pipeline
        if: failure()
        run: |
          echo "## Pipeline FALHOU" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Posts do periodo podem ter sido perdidos." >> $GITHUB_STEP_SUMMARY
          echo "> Para recuperar: acesse Actions, clique em 'Run workflow' manualmente." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Horario:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "**Acoes:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
