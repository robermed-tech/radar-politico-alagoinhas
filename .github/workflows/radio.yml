name: Escuta do Rádio — captação

# Workflow separado do ÁGORA de propósito. O ator da Apify grava o stream EM
# TEMPO REAL, então uma captação de 30 minutos é um run de 30 minutos. O step do
# agora.yml tem timeout de 20 min e o job de 30: capturar lá dentro derrubaria o
# pipeline inteiro (Instagram, clima, alertas, briefing) no dia em que o horário
# de um programa coincidisse com uma das três rodadas.
#
# Aqui a captação tem o horário e o timeout dela. A ANÁLISE das transcrições
# continua acontecendo no agora.py a cada rodada normal, porque é rápida e lê do
# banco — mas roda também no fim deste workflow, para a pauta aparecer no painel
# logo depois do programa em vez de esperar a próxima execução do ÁGORA.

on:
  schedule:
    # O cron do GitHub NÃO é pontual: nos três últimos agendamentos das
    # 10:00 UTC ele disparou 11:52, 12:00 e 12:55 (medido em 03/08/2026) —
    # atraso de 1h52 a 2h55, muito além dos 20 min de tolerância do coletor.
    # Mirar o horário do programa é mirar um alvo que o agendador não acerta.
    #
    # A estratégia é outra: disparos ESCALONADOS ANTES do programa, e o
    # coletor espera a janela abrir (`--aguardar 45`, ver minutos_ate_abrir no
    # coletor_radio.py). O primeiro run que alcançar a janela grava; os outros
    # saem em segundos pela trava "já captada hoje". Para a janela de 07:00
    # BRT (10:00 UTC), os quatro disparos abaixo cobrem qualquer atraso de 0 a
    # ~3h13 com espera máxima de 45 min:
    #
    #   07:07 UTC (04:07 BRT) — cobre atraso de 2h08 a 3h13
    #   08:07 UTC (05:07 BRT) — cobre atraso de 1h08 a 2h13
    #   09:07 UTC (06:07 BRT) — cobre atraso de 0h08 a 1h13
    #   09:37 UTC (06:37 BRT) — cobre atraso de 0h00 a 0h43
    #
    # (minuto :07/:37 de propósito: o pico de atraso é no minuto :00, o mais
    # disputado da fila do GitHub.) Se o `hora_inicio` cadastrado mudar, estes
    # crons precisam andar junto — a mesma regra de antes, agora com ~3h de
    # margem em vez de 20 min.
    - cron: '7 7 * * 1-5'
    - cron: '7 8 * * 1-5'
    - cron: '7 9 * * 1-5'
    - cron: '37 9 * * 1-5'
  workflow_dispatch:
    inputs:
      ignorar_janela:
        description: 'Capturar agora, fora da faixa horária cadastrada (teste)'
        type: boolean
        default: false
      dry_run:
        description: 'Captar e mostrar sem gravar no banco'
        type: boolean
        default: false
      # As duas entradas abaixo são o que o botão GRAVAR da tela Escuta do
      # Rádio preenche (via Edge Function `gravar-radio`). Vazias, o workflow
      # se comporta exatamente como antes: todas as ativas, na janela e com a
      # duração do cadastro.
      estacoes:
        description: 'IDs das rádios a gravar, separados por vírgula (vazio = todas as ativas)'
        type: string
        default: ''
      duracao:
        description: 'Minutos de captura (vazio = duração do cadastro)'
        type: string
        default: ''
      apenas_clipes:
        description: 'Nao capta nada: so gera os clipes de audio das citacoes que ainda nao tem'
        type: boolean
        default: false
      refazer_clipes:
        description: 'Com apenas_clipes: refaz tambem os clipes que ja existem (corrige recorte antigo)'
        type: boolean
        default: false

# Um run de captação por vez. Sem isto, dois crons escalonados que chegassem
# perto da janela dormiriam JUNTOS, acordariam juntos e os dois pagariam
# gravação — a trava "já captada hoje" só enxerga bloco depois que o primeiro
# grava. Enfileirado, o segundo roda depois e a trava o dispensa em segundos.
concurrency:
  group: escuta-radio
  cancel-in-progress: false

jobs:
  captar:
    runs-on: ubuntu-latest
    # Folga sobre a captação mais longa que o painel oferece (120 min) + a
    # transcrição + margem. O run da Apify tem o timeout dele calculado em
    # coletor_radio.py; este aqui é a rede de segurança do lado do Actions.
    # O limite do GitHub é 6 h por job, então há espaço — mas o teto de duração
    # do coletor e da Edge Function (120) tem que continuar CABENDO aqui: se um
    # dia ele subir sem que estes números subam junto, o job é abortado no meio
    # e a captação inteira vira crédito gasto sem transcrição nenhuma.
    #
    # Subiu de 140 para 230 em 31/07: o overhead de transcrição é proporcional
    # ao áudio, e a conta antiga (duração + 10 min fixos) não fechava nem no
    # caso medido de 4 × 30 min, quanto mais no teto de 120. E de 230 para 275
    # em 03/08: o run agendado pode dormir até 45 min esperando a janela
    # (`--aguardar 45`), então a conta vira 45 de espera + 195 do
    # TETO_ESPERA_SEG + margem — 245 no step e 275 no job.
    timeout-minutes: 275

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar ffmpeg
        # Medido em 30/07: o ubuntu-latest NÃO traz ffmpeg pré-instalado (o
        # step de clipes registrou "ffmpeg ausente" e saiu sem recortar nada).
        # Sem ele a pauta é gravada e o card fica sem o botão de ouvir — falha
        # silenciosa, que é o pior tipo. Leva ~15 s e só roda quando há recorte
        # a fazer.
        if: ${{ inputs.dry_run != true }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Captar rádios
        if: ${{ inputs.apenas_clipes != true }}
        # Tem que ser MAIOR que a espera pela janela (45 min do --aguardar) +
        # TETO_ESPERA_SEG do coletor_radio.py (195 min): o Python precisa
        # conseguir desistir e imprimir o `--adotar-radio <run_id>` antes de o
        # Actions matar o job. Se o step vencer primeiro, o processo morre sem
        # deixar o id, e recuperar a captação já paga passa a exigir garimpar
        # o console da Apify.
        timeout-minutes: 245
        env:
          APIFY_API_TOKEN:      ${{ secrets.APIFY_API_TOKEN }}
          # O ator declara groqApiKey como required e NÃO guarda a chave: quem
          # chama precisa passá-la. Sem este secret o coletor encerra antes de
          # tocar na Apify, para não queimar um run que falharia na largada.
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RADAR_TENANT:         alagoinhas
        run: |
          ARGS="--radio"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--radio-dry-run"; fi
          if [ "${{ inputs.ignorar_janela }}" = "true" ]; then ARGS="$ARGS --agora"; fi
          # Gravação sob demanda pedida no painel. `--estacoes` já implica
          # ignorar a janela no coletor: quem apertou GRAVAR quer agora.
          if [ -n "${{ inputs.estacoes }}" ]; then ARGS="$ARGS --estacoes ${{ inputs.estacoes }}"; fi
          if [ -n "${{ inputs.duracao }}" ];  then ARGS="$ARGS --duracao ${{ inputs.duracao }}"; fi
          # Run agendado chega ANTES do programa (crons escalonados, ver topo
          # do arquivo) e espera a janela abrir. Disparo manual não espera:
          # quem disparou na mão quer resposta agora.
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --aguardar 45"; fi
          echo "Executando: python agora.py $ARGS"
          python agora.py $ARGS

      - name: Analisar as pautas captadas
        # Não roda em dry-run (não há bloco gravado) nem no modo só-clipes.
        if: ${{ inputs.dry_run != true && inputs.apenas_clipes != true }}
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # O recorte do clipe de áudio da citação baixa o bloco do key-value
          # store da Apify: sem este token a análise grava a pauta e o card fica
          # sem o botão de ouvir, silenciosamente.
          APIFY_API_TOKEN:      ${{ secrets.APIFY_API_TOKEN }}
          RADAR_TENANT:         alagoinhas
        run: python agora.py --analisar-radio

      - name: Gerar clipes de áudio pendentes
        # Preenche o botão "ouvir o trecho" de pautas que ficaram sem clipe —
        # análise que rodou antes deste recurso, ou sem o token acima. Só vale
        # enquanto o áudio existir na Apify: a retenção do plano é de 3 dias.
        if: ${{ inputs.apenas_clipes == true }}
        timeout-minutes: 20
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_API_TOKEN:      ${{ secrets.APIFY_API_TOKEN }}
          # O recorte não chama o modelo, mas o agora.py lê a chave no import
          # (`os.environ["ANTHROPIC_API_KEY"]`, linha 322) e sem ela o processo
          # nem começa. É exigência do módulo, não deste modo.
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_TENANT:         alagoinhas
        run: python agora.py --clipes-radio 10 ${{ inputs.refazer_clipes && '--refazer' || '' }}

      - name: Notifica falha no WhatsApp
        if: failure()
        env:
          EVOLUTION_API_URL:  ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:  ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:    ${{ secrets.EVOLUTION_GROUP_ID }}
        run: |
          # Mesmo motivo do agora.yml: o `|| true` fica (o aviso não derruba o
          # job), mas status e corpo passam a aparecer no log — senão um canal
          # quebrado se parece com um aviso entregue.
          CODIGO=$(curl -s -o /tmp/wa.txt -w "%{http_code}" \
            -X POST "$EVOLUTION_API_URL/message/sendText/$EVOLUTION_INSTANCE" \
            -H "Content-Type: application/json" \
            -H "apikey: $EVOLUTION_API_KEY" \
            -d "{\"number\":\"$WHATSAPP_NUMBER\",\"text\":\"⚠️ Escuta do Rádio: falha na captação. Verifique o GitHub Actions.\"}") || true
          echo "WhatsApp (grupo): HTTP $CODIGO"
          if [ "$CODIGO" != "200" ] && [ "$CODIGO" != "201" ]; then
            echo "::warning::Aviso ao grupo NAO entregue (HTTP $CODIGO): $(head -c 300 /tmp/wa.txt)"
          fi
