name: ÁGORA — Radar Político Alagoinhas

on:
  schedule:
    # Roda 3x/dia (BRT = UTC-3)
    # 08:00 BRT = 11:00 UTC
    # 14:00 BRT = 17:00 UTC
    # 19:00 BRT = 22:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:  # Permite executar manualmente

jobs:
  agora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # O canal de reserva do alerta_suporte abre (ou comenta em) uma issue
    # quando WhatsApp e SMS falham. Sem esta permissão o GITHUB_TOKEN é
    # read-only e a reserva falharia calada — o defeito que ela corrige.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar ÁGORA
        id: executar_agora
        timeout-minutes: 20
        env:
          APIFY_API_TOKEN:      ${{ secrets.APIFY_API_TOKEN }}
          IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_PROXY:             ${{ secrets.IG_PROXY }}
          IG_SESSION_JSON:      ${{ secrets.IG_SESSION_JSON }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          EVOLUTION_API_URL:    ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:    ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:   ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:      ${{ secrets.EVOLUTION_GROUP_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTOR_HASH_SALT:      ${{ secrets.AUTOR_HASH_SALT }}
          RADAR_TENANT:         alagoinhas
          # Alerta de suporte admin-configuravel (Configuracoes > Alerta de
          # Suporte). TWILIO_* ficam vazios ate o admin criar a conta/secret —
          # alerta_suporte.py degrada em log, sem quebrar o pipeline.
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:   ${{ secrets.TWILIO_FROM_NUMBER }}
          CALLMEBOT_APIKEY:     ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          # O agora.py dispara o alerta de dentro do próprio except, então o
          # canal de reserva precisa do token aqui também — não só no backstop.
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: python agora.py

      - name: Verificar se dados foram gravados no Supabase
        id: verificar_supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=$(curl -s \
            "$SUPABASE_URL/rest/v1/posts?tenant=eq.alagoinhas&select=url&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -o /dev/null -w "%{http_code}")
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "::error::Supabase não acessível após run (HTTP $STATUS) — verifique SUPABASE_SERVICE_KEY"
            exit 1
          fi
          echo "Supabase OK (HTTP $STATUS)"

      # Backstop do alerta de suporte: cobre os casos que o proprio agora.py
      # NAO consegue reportar sozinho (processo morto pelo timeout antes de
      # rodar qualquer except, crash no import, ou o post-check do Supabase
      # falhando com agora.py já tendo saído 0). Quando agora.py CONSEGUIU
      # capturar a excecao internamente, ele grava o marcador abaixo e ja
      # mandou um alerta mais especifico — este step so preenche a lacuna,
      # nunca duplica.
      - name: Alerta de suporte (WhatsApp/SMS do numero cadastrado pelo admin)
        if: failure()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RADAR_TENANT:         alagoinhas
          EVOLUTION_API_URL:    ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:    ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:   ${{ secrets.EVOLUTION_INSTANCE }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:   ${{ secrets.TWILIO_FROM_NUMBER }}
          CALLMEBOT_APIKEY:     ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          # Canal de reserva (issue no repo). Injetado pelo Actions, não é
          # secret a cadastrar.
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .alerta_suporte_enviado ]; then
            echo "agora.py ja enviou um alerta especifico para este incidente — pulando duplicata."
          else
            if [ "${{ steps.executar_agora.outcome }}" = "failure" ]; then
              MOTIVO="Step 'Executar AGORA' falhou ou excedeu o timeout de 20min — o processo foi encerrado pelo GitHub Actions antes de conseguir reportar o erro real."
            else
              MOTIVO="agora.py terminou sem lancar erro, mas a checagem pos-run nao confirmou dados novos no Supabase (step 'Verificar se dados foram gravados no Supabase')."
            fi
            python alerta_suporte.py --origem agora_yml_backstop --motivo "$MOTIVO" || true
          fi

      - name: Notifica falha no WhatsApp (grupo)
        if: failure()
        env:
          EVOLUTION_API_URL:  ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:  ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:    ${{ secrets.EVOLUTION_GROUP_ID }}
        run: |
          # `|| true` continua aqui de propósito: o aviso não pode derrubar o
          # job que já está falhando. O que mudou é que o resultado passou a
          # APARECER — antes o `-s` mais o `|| true` descartavam status e corpo,
          # então um canal quebrado (ex.: o 404 da Evolution visto em 31/07)
          # ficava indistinguível de um aviso entregue.
          CODIGO=$(curl -s -o /tmp/wa.txt -w "%{http_code}" \
            -X POST "$EVOLUTION_API_URL/message/sendText/$EVOLUTION_INSTANCE" \
            -H "Content-Type: application/json" \
            -H "apikey: $EVOLUTION_API_KEY" \
            -d "{\"number\":\"$WHATSAPP_NUMBER\",\"text\":\"⚠️ ÁGORA: falha na execução. Verifique o GitHub Actions.\"}") || true
          echo "WhatsApp (grupo): HTTP $CODIGO"
          if [ "$CODIGO" != "200" ] && [ "$CODIGO" != "201" ]; then
            echo "::warning::Aviso ao grupo NAO entregue (HTTP $CODIGO): $(head -c 300 /tmp/wa.txt)"
          fi
