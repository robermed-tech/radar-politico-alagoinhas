name: ÁGORA — Radar Político Alagoinhas

on:
  schedule:
    # Roda 3x/dia (BRT = UTC-3)
    # 08:00 BRT = 11:00 UTC
    # 14:00 BRT = 17:00 UTC
    # 19:00 BRT = 22:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:  # Permite executar manualmente

jobs:
  agora:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar ÁGORA
        timeout-minutes: 20
        env:
          APIFY_API_TOKEN:      ${{ secrets.APIFY_API_TOKEN }}
          IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_PROXY:             ${{ secrets.IG_PROXY }}
          IG_SESSION_JSON:      ${{ secrets.IG_SESSION_JSON }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID:       ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS:   ${{ secrets.GOOGLE_SA_JSON }}
          EVOLUTION_API_URL:    ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:    ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:   ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:      ${{ secrets.EVOLUTION_GROUP_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTOR_HASH_SALT:      ${{ secrets.AUTOR_HASH_SALT }}
          RADAR_TENANT:         alagoinhas
        run: python agora.py

      - name: Verificar se dados foram gravados no Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=$(curl -s \
            "$SUPABASE_URL/rest/v1/posts?tenant=eq.alagoinhas&select=url&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -o /dev/null -w "%{http_code}")
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "::error::Supabase não acessível após run (HTTP $STATUS) — verifique SUPABASE_SERVICE_KEY"
            exit 1
          fi
          echo "Supabase OK (HTTP $STATUS)"

      - name: Notifica falha no WhatsApp
        if: failure()
        env:
          EVOLUTION_API_URL:  ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:  ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:    ${{ secrets.EVOLUTION_GROUP_ID }}
        run: |
          curl -s -X POST "$EVOLUTION_API_URL/message/sendText/$EVOLUTION_INSTANCE" \
            -H "Content-Type: application/json" \
            -H "apikey: $EVOLUTION_API_KEY" \
            -d "{\"number\":\"$WHATSAPP_NUMBER\",\"text\":\"⚠️ ÁGORA: falha na execução. Verifique o GitHub Actions.\"}" || true
