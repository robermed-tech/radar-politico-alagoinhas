# Reparo de acentuação dos briefings gravados (06/08/26).
#
# Os prompts passaram a exigir português acentuado, mas o que já estava em
# ai_briefings veio da era sem acento — e, com a coleta vazia desde 02/08, o
# pipeline aborta cedo e não regenera briefing nenhum sozinho. Este workflow
# roda o reparo com os MESMOS secrets do agora.yml (a máquina local não tem
# credenciais do backend).
#
# Dispara UMA vez sozinho no push deste arquivo (é o jeito de executar um
# one-off sem PAT local) e depois fica disponível em "Run workflow". O passo
# de dry-run roda sempre antes, deixando o antes/depois auditável no log.
name: Reparo — acentuação dos briefings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar o antes/depois, sem gravar"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/reparo-acentos.yml"
      - ".github/scripts/*.py"

concurrency:
  group: reparo-acentos
  cancel-in-progress: false

# issues: write é para o passo de diagnóstico publicar o veredito numa issue
# (rótulo reparo-acentos) — os LOGS do Actions não são legíveis sem token, e o
# primeiro run saiu verde com efeito zero justamente por falha silenciosa.
permissions:
  contents: read
  issues: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Caminho SEM modelo: mapa determinístico derivado do corpus real (a API
      # Anthropic está sem crédito — issue reparo-acentos — e o reparo via
      # modelo abaixo degrada em silêncio até o crédito voltar). Cobre
      # ai_briefings (Estação Meteorológica) e posts (Feed). Validado por
      # teste de regressão local e revisão adversarial antes do push.
      - name: Acentuar textos sem modelo (mapa determinístico)
        timeout-minutes: 5
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/acentuar_textos.py ${{ github.event_name != 'push' && inputs.dry_run == true && '--dry-run' || '' }}

      - name: Dry-run (auditoria do antes/depois)
        timeout-minutes: 8
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python agora.py --reparar-acentos-briefings --dry-run

      - name: Aplicar o reparo
        timeout-minutes: 8
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python agora.py --reparar-acentos-briefings

      # Semana e mês ganham também um briefing NOVO do dia de hoje, gerado do
      # histórico já no Supabase pelo mesmo caminho da produção — já nasce
      # acentuado pelo prompt corrigido. (O "dia" não é regenerável sem posts
      # novos; a linha antiga dele sai corrigida pelo passo acima.)
      - name: Regenerar briefings de semana e mês
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python agora.py --testar-briefings-periodo

      # Sonda camada por camada + issue com o veredito. FALHA o job quando o
      # reparo não surtiu efeito — um job verde com efeito zero foi o que
      # aconteceu no primeiro run, e ninguém de fora conseguia ler o porquê.
      - name: Diagnóstico das camadas (falha se o efeito for zero)
        if: ${{ always() }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/diagnostico_reparo.py
