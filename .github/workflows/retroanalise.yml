name: ÁGORA — Retroanálise (varredura histórica)

on:
  workflow_dispatch:  # Executar manualmente via GitHub Actions → Run workflow

jobs:
  retroanalise:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Maior que o normal: processa todos os posts com Sonnet

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar retroanálise
        timeout-minutes: 80
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTOR_HASH_SALT:      ${{ secrets.AUTOR_HASH_SALT }}
          RADAR_TENANT:         alagoinhas
        run: python agora.py --retroanalise
