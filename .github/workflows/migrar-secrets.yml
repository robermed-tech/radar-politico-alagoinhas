# Migração pontual: copia os secrets do Actions DESTE repo (robermed-tech/
# radar-politico-alagoinhas) para o repo novo (vaporfilmes-ops/radar-politico).
#
# Por que um workflow: secret do GitHub é write-only — o único lugar onde os
# valores existem é o contexto do Actions deste repo. O mesmo padrão do
# reparo-acentos.yml: dispara sozinho no push deste arquivo (branch
# migracao-secrets) e fica disponível em "Run workflow".
#
# Exige o secret MIGRATE_PAT neste repo: um PAT de conta com admin no repo
# novo (fine-grained com "Secrets: Read and write" no vaporfilmes-ops/
# radar-politico, ou classic com escopo "repo"). Sem ele o job falha na
# largada com a instrução — nada é enviado.
#
# Os valores nunca aparecem no log: entram no gh via stdin e o GitHub ainda
# mascara qualquer eco acidental. GOOGLE_SA_JSON/GOOGLE_SHEET_ID ficam de
# fora de propósito (só o radar.yml desabilitado os usa; o Sheets saiu do
# fluxo em 01/08/2026). Depois da migração este arquivo pode ser removido.
name: Migrar secrets para o repo novo

on:
  push:
    branches: [migracao-secrets]
  workflow_dispatch:

permissions:
  contents: read

concurrency: migrar-secrets

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DESTINO: vaporfilmes-ops/radar-politico
      GH_TOKEN: ${{ secrets.MIGRATE_PAT }}
    steps:
      - name: Copiar secrets para o repo novo
        env:
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          S_AUTOR_HASH_SALT: ${{ secrets.AUTOR_HASH_SALT }}
          S_CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          S_EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          S_EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          S_EVOLUTION_GROUP_ID: ${{ secrets.EVOLUTION_GROUP_ID }}
          S_EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S_IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          S_IG_PROXY: ${{ secrets.IG_PROXY }}
          S_IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          S_IG_USERNAME: ${{ secrets.IG_USERNAME }}
          S_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S_SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          S_SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          S_TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          S_TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          S_TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          S_TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta o secret MIGRATE_PAT neste repo. Crie um PAT de conta com admin no ${DESTINO} (fine-grained: Repository permissions > Secrets: Read and write; ou classic com escopo repo), cadastre-o em Settings > Secrets and variables > Actions como MIGRATE_PAT e re-execute este job."
            exit 1
          fi
          copiados=0; pulados=0; falhas=0
          copiar() {
            local nome="$1" valor="$2"
            if [ -z "$valor" ]; then
              echo "::warning::${nome} nao existe (ou esta vazio) neste repo; pulado"
              pulados=$((pulados+1)); return 0
            fi
            if printf '%s' "$valor" | gh secret set "$nome" --repo "$DESTINO"; then
              echo "${nome}: cadastrado em ${DESTINO}"
              copiados=$((copiados+1))
            else
              echo "::error::${nome}: falha ao cadastrar em ${DESTINO}"
              falhas=$((falhas+1))
            fi
          }
          copiar ANTHROPIC_API_KEY "$S_ANTHROPIC_API_KEY"
          copiar APIFY_API_TOKEN "$S_APIFY_API_TOKEN"
          copiar AUTOR_HASH_SALT "$S_AUTOR_HASH_SALT"
          copiar CALLMEBOT_APIKEY "$S_CALLMEBOT_APIKEY"
          copiar EVOLUTION_API_KEY "$S_EVOLUTION_API_KEY"
          copiar EVOLUTION_API_URL "$S_EVOLUTION_API_URL"
          copiar EVOLUTION_GROUP_ID "$S_EVOLUTION_GROUP_ID"
          copiar EVOLUTION_INSTANCE "$S_EVOLUTION_INSTANCE"
          copiar GROQ_API_KEY "$S_GROQ_API_KEY"
          copiar IG_PASSWORD "$S_IG_PASSWORD"
          copiar IG_PROXY "$S_IG_PROXY"
          copiar IG_SESSION_JSON "$S_IG_SESSION_JSON"
          copiar IG_USERNAME "$S_IG_USERNAME"
          copiar SUPABASE_SERVICE_KEY "$S_SUPABASE_SERVICE_KEY"
          copiar SUPABASE_URL "$S_SUPABASE_URL"
          copiar SURGE_LOGIN "$S_SURGE_LOGIN"
          copiar SURGE_TOKEN "$S_SURGE_TOKEN"
          copiar TWILIO_ACCOUNT_SID "$S_TWILIO_ACCOUNT_SID"
          copiar TWILIO_AUTH_TOKEN "$S_TWILIO_AUTH_TOKEN"
          copiar TWILIO_FROM_NUMBER "$S_TWILIO_FROM_NUMBER"
          copiar TWILIO_WHATSAPP_FROM "$S_TWILIO_WHATSAPP_FROM"
          echo "Resumo: ${copiados} cadastrados, ${pulados} pulados, ${falhas} falhas"
          [ "$falhas" -eq 0 ]

      - name: Conferir no destino (nomes e datas, nunca valores)
        run: gh secret list --repo "$DESTINO"
