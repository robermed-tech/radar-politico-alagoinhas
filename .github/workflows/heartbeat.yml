name: Viratempo — Heartbeat

# Vigia independente do pipeline ÁGORA. Roda no seu próprio cron (não no do
# agora.yml) para conseguir detectar o caso em que o AGENDAMENTO do agora.yml
# parou de disparar — algo que nenhum código dentro do agora.py consegue
# perceber, porque nesse caso o agora.py simplesmente nunca é executado.
on:
  schedule:
    # A cada 15min (offset de :00 pra fugir do congestionamento de topo de
    # hora do GitHub) — cobre o pedido de monitoramento 24/7 com deteccao
    # praticamente imediata do cron do agora.yml sumindo. O LIMIAR_HORAS
    # (15h, ver heartbeat_check.py) e quem decide se ha alerta de verdade;
    # rodar mais vezes so deixa a deteccao mais fina, nao mais alarmista —
    # o job e uma unica leitura no Supabase, gasta segundos.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      teste_alerta:
        description: 'Disparar um alerta de TESTE pro numero cadastrado (ignora saude real do pipeline)'
        type: boolean
        default: false
      diagnostico:
        description: 'Nao envia nada: testa host, instancia e numero em separado e diz onde esta a falha'
        type: boolean
        default: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # O canal de reserva do alerta_suporte abre (ou comenta em) uma issue
    # quando WhatsApp e SMS falham. Sem esta permissão o GITHUB_TOKEN é
    # read-only e a reserva falharia calada — que é exatamente o defeito que
    # ela existe para corrigir.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias minimas
        run: pip install requests

      # Separado do step de baixo de propósito: o diagnóstico não envia
      # mensagem nenhuma, então pode ser rodado à vontade enquanto se conserta
      # o canal, sem torrar tentativa de entrega nem poluir o alerta_historico.
      - name: Diagnosticar o canal de alerta
        if: ${{ inputs.diagnostico == true }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RADAR_TENANT:         alagoinhas
          EVOLUTION_API_URL:    ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:    ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:   ${{ secrets.EVOLUTION_INSTANCE }}
          # Sem a chave aqui, o diagnóstico enxergava um cenário DIFERENTE do
          # envio real (que a recebe): diria "nenhum provedor" com o CallMeBot
          # configurado e funcionando.
          CALLMEBOT_APIKEY:     ${{ secrets.CALLMEBOT_APIKEY }}
        run: python alerta_suporte.py --diagnostico

      - name: Checar saude do pipeline ÁGORA
        if: ${{ inputs.diagnostico != true }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RADAR_TENANT:         alagoinhas
          EVOLUTION_API_URL:    ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:    ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:   ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:      ${{ secrets.EVOLUTION_GROUP_ID }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:   ${{ secrets.TWILIO_FROM_NUMBER }}
          CALLMEBOT_APIKEY:     ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TESTE_ALERTA:         ${{ inputs.teste_alerta }}
          # Canal de reserva (issue no repo). O Actions injeta este token
          # sozinho — não é secret a cadastrar.
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: python heartbeat_check.py
